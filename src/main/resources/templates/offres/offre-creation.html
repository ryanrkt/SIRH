<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Création d'offre – Recrut</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main>
        <h1>Création d'offre d'emploi</h1>
        <form id="f" class="card f">
            <label>N° de la demande<input id="i" name="id" readonly></label>
            <label>Titre de l'offre<input id="p" name="titre" required></label>
            <label>Département<input id="d" name="dept"  required></label>
            <label>Salaire (Ar)<input id="s" type="number" name="salaire" required></label>
            <label class="w">Description<textarea name="desc" rows="6" required></textarea></label>
            <div class="w">
                <button class="btn">Publier l'offre</button>
            </div>
        </form>
    </main>
    <script src="/js/app.js"></script>
    <script>const q = D.demandes.find(x => x.id == P.get('demande')) || {}; i.value = q.id || ''; p.value = q.poste || ''; d.value = q.dept || ''; s.value = q.salaire || ''; f.onsubmit = e => { e.preventDefault(); const v = Object.fromEntries(new FormData(f)), o = { id: nid(D.offres), demande: q.id, titre: v.titre, dept: v.dept, salaire: +v.salaire, desc: v.desc }; D.offres.push(o); if (q.id) q.offre = o.id; save(); location = 'rh-offres.html' }</script>
</body>

</html>
