<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Détail du candidat – Recrut</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main></main>
    <script src="app.js"></script>
    <script>const c = D.candidats.find(x => x.id == P.get('id')), o = c && D.offres.find(x => x.id == c.offre); $('main').innerHTML = c ? `<a href="candidats.html?offre=${c.offre}">Retour aux candidats</a><div class=card style=margin-top:12px><h1>${c.nom}</h1><p>Email : ${c.email}<br>Téléphone : ${c.tel || '–'}<br>Offre : ${o ? o.titre : '–'}</p><p><b>Remarque sur l'offre</b><br>${c.remarque || 'Aucune'}</p></div>` : '<p class=empty>Candidat introuvable.</p>'</script>
</body>

</html>
