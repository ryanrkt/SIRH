<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <!-- <meta name="viewport" content="width=device-width,initial-scale=1"> -->
    <title>Connexion – Recrut</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-bare>
    <main class="auth">
        <div class="card">
            <h1>Connexion</h1>
            <form id="f" class="col"><label>Email<input type="email" required></label><label>Mot de passe<input
                        type="password" required></label><label>Espace<select id="r">
                        <option value="rh">RH
                        <option value="finance">Finance
                        <option value="direction">Direction
                        <option value="demande">Département
                    </select></label><button class="btn">Se connecter</button></form>
            <p><a href="offres.html">Voir les offres d'emploi</a></p>
        </div>
    </main>
    <script src="app.js"></script>
    <script>f.onsubmit = e => { e.preventDefault(); const m = $('input').value; localStorage.setItem('rh_user', JSON.stringify({ role: $('#r').value, nom: m.split('@')[0], email: m })); location = $('#r').value + '.html' }</script>
</body>

</html>
