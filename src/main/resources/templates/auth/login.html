<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SIRH</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Notre CSS Pro -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">

    <div class="split-container">
        <!-- Volet de gauche : Formulaire -->
        <div class="auth-left-pane">
            
            <div class="mb-4">
                <h2 class="fw-bold" style="color: var(--ink); font-size: 26px;">Connexion</h2>
                <p class="text-muted" style="font-size: 14px;">Accédez à vos outils de gestion.</p>
            </div>

            <!-- Messages d'alerte -->
            <div th:if="${param.registered}" class="alert-custom-success">
                Inscription réussie ! Vous pouvez vous connecter.
            </div>
            <div th:if="${param.error}" class="alert-custom-danger">
                Email ou mot de passe incorrect.
            </div>
            <div th:if="${param.logout}" class="alert-custom-success" style="background-color: #e4e9ee; color: var(--ink);">
                Vous avez été déconnecté avec succès.
            </div>

            <!-- Formulaire de connexion -->
            <form th:action="@{/login}" method="post">
                <label>
                    Identifiant (Email)
                    <input type="email" id="username" name="username" class="form-control" required autofocus placeholder="votre.email@sirh.mg">
                </label>

                <label>
                    Mot de passe
                    <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
                </label>

                <button type="submit" class="btn-custom mt-3">Se connecter</button>
            </form>

            <div class="auth-footer text-start mt-4">
                <span class="text-muted">Pas encore de compte ?</span> 
                <a th:href="@{/register}">S'inscrire en tant que candidat</a>
            </div>
        </div>

        <!-- Volet de droite : Image professionnelle -->
        <div class="auth-right-pane"></div>
    </div>

</body>
</html>
