<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:fragment="app(contentFragment)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Espace RH</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ton fichier CSS personnalisé -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background-color: var(--bg); display: flex; flex-direction: column; min-height: 100vh; margin: 0;">

    <!-- Wrapper principal en mode flex (Sidebar à gauche, Contenu à droite) -->
    <div class="d-flex flex-grow-1">
        
        <!-- Inclusion de la Sidebar -->
        <div th:replace="~{rh/layout/sidebar :: sidebar}"></div>

        <!-- Zone principale de droite (Contenu dynamique + Footer) -->
        <div class="flex-grow-1 d-flex flex-column">
            
            <!-- Contenu dynamique injecté par les pages filles -->
            <main class="flex-grow-1 p-4">
                <div th:replace="${contentFragment}"></div>
            </main>

            <!-- Inclusion du Footer -->
            <div th:replace="~{rh/layout/footer :: footer}"></div>
            
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
