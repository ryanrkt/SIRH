<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Candidature – Recrut</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-bare>
    <main class="auth" style="max-width:520px;margin-top:6vh">
        <div class="card">
            <h1>Se connecter et postuler</h1>
            <form id="f" class="col"><label>Nom complet<input name="nom" required></label><label>Email<input
                        type="email" name="email" required></label><label>Téléphone<input name="tel"></label><label>Mot
                    de passe<input type="password" required></label><label>Remarque sur l'offre (ex : le salaire ne me
                    convient pas)<textarea name="remarque" rows="3"></textarea></label><button class="btn">Se connecter
                    et envoyer ma candidature</button></form>
            <p><a href="offres.html">Retour aux offres</a></p>
        </div>
    </main>
    <script src="/js/app.js"></script>
    <script>f.onsubmit = e => { e.preventDefault(); const v = Object.fromEntries(new FormData(f)); localStorage.setItem('rh_user', JSON.stringify({ role: 'candidat', nom: v.nom, email: v.email })); D.candidats.push({ id: nid(D.candidats), offre: +P.get('offre'), nom: v.nom, email: v.email, tel: v.tel, remarque: v.remarque.trim(), sel: 0 }); save(); alert('Candidature envoyée.'); location = 'offres.html' }</script>
</body>

</html>
